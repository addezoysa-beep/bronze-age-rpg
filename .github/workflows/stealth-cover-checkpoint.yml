name: Stealth cover checkpoint
on:
  pull_request:
    paths:
      - 'checkpoints/continuation-20261011/scripts/*stealth-cover*'
      - 'checkpoints/continuation-20261011/scripts/build-stealth-cover-candidate.mjs'
      - 'checkpoints/continuation-20261011/scripts/build-harbour-detour-candidate.mjs'
      - 'checkpoints/continuation-20261011/scripts/harbour-detour-patch.mjs'
      - 'checkpoints/continuation-20261011/scripts/assemble-harbour-detour-candidate.mjs'
      - '.github/workflows/stealth-cover-checkpoint.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: checkpoints/continuation-20261011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-current.mjs
      - run: node scripts/build-stealth-cover-candidate.mjs
      - run: node scripts/verify-stealth-cover-checkpoint.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stealth-cover-281
          path: |
            checkpoints/continuation-20261011/dist/Wine-Dark-Sea-Stealth-Cover-281.html
            checkpoints/continuation-20261011/dist/stealth-cover-281-manifest.json
          if-no-files-found: error
