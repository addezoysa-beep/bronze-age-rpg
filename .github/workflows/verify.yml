name: Milestone verification
on:
  push:
    branches: [main, master-development, 'm*/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository:
    timeout-minutes: 10
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify.mjs
      - run: node scripts/build-offline.mjs
      - run: node --test scripts/*.test.mjs
      - name: Main milestone gate
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/main-check.mjs
  browser:
    timeout-minutes: 20
    name: Offline browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select current build source
        id: source
        run: |
          if [ -f checkpoints/continuation-20261011/scripts/build-current.mjs ]; then
            echo 'directory=checkpoints/continuation-20261011' >> "$GITHUB_OUTPUT"
            echo 'builder=scripts/build-current.mjs' >> "$GITHUB_OUTPUT"
            echo 'artifact=checkpoints/continuation-20261011/dist/Wine-Dark-Sea-Combined-Cinematic.html' >> "$GITHUB_OUTPUT"
          else
            echo 'directory=.' >> "$GITHUB_OUTPUT"
            echo 'builder=scripts/build-offline.mjs' >> "$GITHUB_OUTPUT"
            echo 'artifact=dist/' >> "$GITHUB_OUTPUT"
          fi
      - run: npm install --ignore-scripts
        working-directory: ${{ steps.source.outputs.directory }}
      - run: npx playwright install --with-deps chromium
        working-directory: ${{ steps.source.outputs.directory }}
      - run: node ${{ steps.source.outputs.builder }}
        working-directory: ${{ steps.source.outputs.directory }}
      - run: node scripts/browser-candidate-smoke.mjs
        working-directory: ${{ steps.source.outputs.directory }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: current-offline-candidate
          path: ${{ steps.source.outputs.artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-browser-evidence
          path: ${{ steps.source.outputs.directory }}/verification/runtime/
