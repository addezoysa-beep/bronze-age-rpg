name: Milestone verification
on:
  push:
    branches: [main, master-development, 'm*/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: milestone-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify.mjs
      - run: node --test scripts/workflow.test.mjs
      - name: Main milestone gate
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/main-check.mjs
  browser:
    timeout-minutes: 15
    env:
      WDS_SMOKE_PRESET: verylow
    name: Offline browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-browser-evidence
          path: verification/runtime/
