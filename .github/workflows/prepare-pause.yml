name: Prepare pause accessibility checkpoint
on:
  push:
    branches: [m0/pause-save-accessibility]
    paths: [.github/workflows/prepare-pause.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-pause-checkpoint.mjs
      - run: node scripts/verify.mjs
      - run: node --test scripts/workflow.test.mjs
      - name: Publish exact generated checkpoint to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tracking/milestones.json tracking/updates/pause-save-accessibility.json verification/records/pause-source-patch.json
          git commit -m "Fix pause guide parent and record current source hash"
          git push origin HEAD:m0/pause-save-accessibility
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pause-checkpoint-evidence
          path: |
            verification/runtime/
            verification/records/pause-source-patch.json
